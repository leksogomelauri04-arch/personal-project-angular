<section class="results">
  <h2>ჩემი ფავორიტები</h2>

  @if (favoriteCars().length > 0) {
    <div class="grid">
      @for (car of favoriteCars(); track car.id) {
        <app-car-card [car]="car" />
      }
    </div>
  } @else {
    <p class="empty">ფავორიტებში ჯერ არაფერი გაქვთ დამატებული.</p>
  }
</section>
