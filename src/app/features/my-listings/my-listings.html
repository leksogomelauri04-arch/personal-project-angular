<div class="my-listings">
  <div class="top">
    <h2>ჩემი განცხადებები</h2>
    <a routerLink="/add-car" class="add-btn">
      <i class="fa-solid fa-plus"></i> მანქანის დამატება
    </a>
  </div>

  @if (carServ.myListings().length === 0) {
    <div class="empty">
      <i class="fa-solid fa-car"></i>
      <p>ჯერ არ გაქვთ დამატებული განცხადება</p>
      <a routerLink="/add-car">დაამატეთ პირველი მანქანა</a>
    </div>
  } @else {
    <div class="grid">
      @for (car of carServ.myListings(); track car.id) {
        <app-car-card [car]="car" [showFavorite]="false" />
      }
    </div>
  }
</div>
