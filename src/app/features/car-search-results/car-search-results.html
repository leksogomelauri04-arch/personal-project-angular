<section class="results">
  <h2>სერჩის შედეგები</h2>

  @if (carServ.listings().length > 0) {
    <div class="grid">
      @for (car of carServ.listings(); track car.id) {
        <app-car-card [car]="car" />
      }
    </div>
  } @else {
    <p class="empty">მანქანები არ მოიძებნა ამ ფილტრებით.</p>
  }
</section>
