<header>
  <div class="main">
    <a routerLink="/cars" class="logo">
      <img src="/logo.png" alt="logo" />
    </a>

    <div class="middle">
      <a routerLink="/cars">მთავარი</a>
      <a routerLink="/about">ჩვენს შესახებ</a>
    </div>

    <div class="left">
      @if (auth.isLoggedIn()) {
        <button type="button" routerLink="/add-car" class="add-car">
          <i class="fa-solid fa-plus"></i> მანქანის დამატება
        </button>

        <a routerLink="/favorites" class="favorites">
          <i class="fa-solid fa-heart"></i>
          @if (favServ.count() > 0) {
            <span class="badge">{{ favServ.count() }}</span>
          }
        </a>

        <div class="profile-menu">
          <button type="button" class="profile-btn" (click)="toggleMenu()">
            <span class="avatar">
              {{ auth.currentUser()?.username?.charAt(0)?.toUpperCase() }}
            </span>
            <span class="name">{{ auth.currentUser()?.username }}</span>
            <i class="fa-solid fa-chevron-down arrow" [class.rotated]="menuOpen()"></i>
          </button>

          @if (menuOpen()) {
            <ul class="profile-dropdown">
              <li>
                <a routerLink="/my-listings" (click)="closeMenu()">
                  <i class="fa-solid fa-car"></i> ჩემი განცხადებები
                </a>
              </li>
              <li>
                <a routerLink="/favorites" (click)="closeMenu()">
                  <i class="fa-solid fa-heart heart"></i> ფავორიტები
                </a>
              </li>
              <li class="divider"></li>
              <li>
                <button type="button" class="logout" (click)="logout()">
                  <i class="fa-solid fa-right-from-bracket"></i> გამოსვლა
                </button>
              </li>
            </ul>
          }
        </div>
      } @else {
        <button type="button" routerLink="/login" class="login-btn">შესვლა</button>
      }
    </div>
  </div>
</header>
